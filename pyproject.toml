[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "fusionify-audio-intelligence"
version = "0.1.0"
description = "Audio timing analysis and music-driven visualizers for Claude through MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.29,<2", "numpy>=2,<3", "scipy>=1.14,<2", "Pillow>=11,<14"]

[project.scripts]
fusionify-audio = "fusionify_audio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fusionify_audio"]
