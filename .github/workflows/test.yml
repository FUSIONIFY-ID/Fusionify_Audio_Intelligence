name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install .
      - name: DSP and boundaries
        run: python -m unittest discover -s tests -v
      - name: MCP lifecycle
        run: python tests/mcp_smoke.py
      - name: HTTP MCP lifecycle
        run: python tests/http_mcp_smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install .
      - run: npm ci
      - name: Validate Claude plugin manifest
        run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate . --strict
      - run: npx playwright install --with-deps chromium
      - name: Creator browser workflow
        run: npm run test:e2e
        env:
          FAI_QA_ARTIFACTS: ${{ runner.temp }}/fai-ui-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-ui-qa
          path: ${{ runner.temp }}/fai-ui-artifacts
          retention-days: 1
