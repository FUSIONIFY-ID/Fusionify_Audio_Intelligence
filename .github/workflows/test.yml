name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install .
      - name: Optional local speech backend (no model download)
        run: |
          python -m pip install '.[speech]'
          python -c "from faster_whisper import WhisperModel; from fusionify_audio.speech import availability; assert not availability()['model_configured']"
      - name: DSP and boundaries
        run: python -m unittest discover -s tests -v
      - name: MCP lifecycle
        run: python tests/mcp_smoke.py
      - name: HTTP MCP lifecycle
        run: python tests/http_mcp_smoke.py
      - name: Native plugin schemas and standalone references
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fai-plugin-schemas"
          curl --fail --silent --show-error --location --max-time 30 --retry 3 https://agent-plugins.org/schemas/1.0.0/plugin.schema.json -o "$RUNNER_TEMP/fai-plugin-schemas/plugin.schema.json"
          curl --fail --silent --show-error --location --max-time 30 --retry 3 https://agent-plugins.org/schemas/1.0.0/mcp.schema.json -o "$RUNNER_TEMP/fai-plugin-schemas/mcp.schema.json"
          python scripts/validate_distribution.py --schema-dir "$RUNNER_TEMP/fai-plugin-schemas"
      - name: Portable native plugin launcher
        run: |
          python -m pip install uv
          python tests/distribution_smoke.py
      - name: Generated editor configurations and full render
        run: python tests/editor_config_smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install .
      - run: npm ci
      - name: Validate Claude plugin manifest
        run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate . --strict
      - name: Real Claude Code CLI connection
        run: python tests/claude_connection_smoke.py
      - name: Discover standalone skills
        run: npx --yes skills@1.7.4 add . --list
        env:
          DISABLE_TELEMETRY: '1'
      - run: npx playwright install --with-deps chromium
      - name: Creator browser workflow
        run: npm run test:e2e
        env:
          FAI_QA_ARTIFACTS: ${{ runner.temp }}/fai-ui-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-ui-qa
          path: ${{ runner.temp }}/fai-ui-artifacts
          retention-days: 1
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fusionify-audio:test .
      - name: Validate compose and authenticated container
        shell: bash
        run: |
          export FAI_API_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          export FAI_PUBLIC_BASE_URL=http://127.0.0.1:8000
          docker compose config --quiet
          docker run -d --name fai-qa --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            --mount type=volume,dst=/data/media --mount type=volume,dst=/data/state \
            -e FAI_API_TOKEN -e FAI_PUBLIC_BASE_URL -p 127.0.0.1:8000:8000 fusionify-audio:test
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error
          for _ in range(100):
              try:
                  if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200:
                      break
              except (urllib.error.URLError, OSError):
                  time.sleep(.2)
          else:
              raise RuntimeError('Container startup timeout')
          data=json.dumps({'operation':'get_workspace','arguments':{}}).encode()
          request=urllib.request.Request('http://127.0.0.1:8000/api/call', data=data, headers={
              'Content-Type':'application/json','Authorization':'Bearer '+os.environ['FAI_API_TOKEN']})
          result=json.load(urllib.request.urlopen(request, timeout=5))
          assert result['version']=='0.7.0', result
          print('PASS: non-root read-only container, compose configuration and authenticated workspace')
          PY
      - name: Container diagnostics
        if: failure()
        run: docker logs fai-qa || true
      - name: Cleanup container
        if: always()
        run: docker rm -fv fai-qa || true
